<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ловец светлячков</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#221c55">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --sky1:#ffe3cf; --sky2:#bda9ee; --ink:#2a2350; --fly:#e89b00; --rock:#5b5477;
  --jar:#2a2350; --panel:rgba(255,255,255,.92); --accent:#5a3fd0; --onaccent:#fff;
  --star:#ffffff; --moon:#fff6e0; --moth:#8a5fd0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#221c55; --sky2:#0a0922; --ink:#f3eeff; --fly:#ffd86b; --rock:#8a84ad;
    --jar:#f3eeff; --panel:rgba(20,17,50,.93); --accent:#ffd86b; --onaccent:#1b1745;
    --star:#ffffff; --moon:#fff1c4; --moth:#c9b6ff;
  }
}
:root[data-theme="dark"]{
  --sky1:#221c55; --sky2:#0a0922; --ink:#f3eeff; --fly:#ffd86b; --rock:#8a84ad;
  --jar:#f3eeff; --panel:rgba(20,17,50,.93); --accent:#ffd86b; --onaccent:#1b1745;
  --star:#ffffff; --moon:#fff1c4; --moth:#c9b6ff;
}
html{height:100%; background:linear-gradient(var(--sky1),var(--sky2)); scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; position:relative; overflow:hidden; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:transparent;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block}
#hud{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
  padding:14px 20px; pointer-events:none}
#score{font-size:28px; font-weight:700; line-height:1}
#combo{font-size:15px; font-weight:600; margin-top:4px; min-height:18px; color:var(--fly)}
#lvl{font-size:14px; font-weight:600; opacity:.8; padding-top:6px; text-align:center}
#right{display:flex; flex-direction:column; align-items:flex-end; gap:8px}
#lives{font-size:26px; font-weight:700; letter-spacing:4px; color:var(--fly); line-height:1}
#pz{pointer-events:auto; font:inherit; font-size:16px; font-weight:700; width:40px; height:40px; border-radius:50%;
  border:2px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; opacity:.75}
#pz:focus-visible,.opt:focus-visible,#panel button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
#panel{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(86%,340px);
  background:var(--panel); border-radius:22px; padding:26px 22px; text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.25)}
#panel h1{margin:0 0 10px; font-size:28px; line-height:1.15}
#panel p{margin:0 0 20px; font-size:16px; line-height:1.45}
#btn{font:inherit; font-size:18px; font-weight:700; border:0; border-radius:14px;
  padding:14px 34px; background:var(--accent); color:var(--onaccent); cursor:pointer}
.opts{display:flex; gap:8px; justify-content:center; margin-top:16px}
.opt{font:inherit; font-size:14px; font-weight:600; border-radius:12px; padding:8px 12px; cursor:pointer;
  border:2px solid var(--ink); background:transparent; color:var(--ink)}
.opt[aria-pressed="false"]{opacity:.5}
#panel{max-height:88%; overflow:auto}
.opts{flex-wrap:wrap}
#quests{margin-top:16px; font-size:14px; line-height:1.55; text-align:left}
#quests b{float:right}
#quests .ok{color:var(--accent)}
#quests .hint{opacity:.7; font-size:13px; margin-top:6px}
#bestv{font-size:13px; opacity:.7; margin-top:3px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div id="score">0</div><div id="bestv"></div><div id="combo"></div></div>
  <div id="lvl"></div>
  <div id="right"><span id="lives"></span><button id="pz" aria-label="Пауза">Ⅱ</button></div>
</div>
<div id="panel">
  <h1 id="title">Ловец светлячков</h1>
  <p id="text">Води банку пальцем и лови светлячков. Камни и мотыльки отнимают жизнь, как и пропущенный светлячок. Золотой даёт +5, ♥ возвращает жизнь, ❄ замедляет время. Ловишь подряд — растёт множитель.</p>
  <button id="btn">Играть</button>
  <div class="opts">
    <button class="opt" id="snd" aria-pressed="true"></button>
    <button class="opt" id="vib" aria-pressed="true"></button>
    <button class="opt" id="mode"></button>
    <button class="opt" id="skin"></button>
    <button class="opt" id="world"></button>
    <button class="opt" id="lang"></button>
    <button class="opt hide" id="share"></button>
    <button class="opt hide" id="fin">Завершить</button>
  </div>
  <div id="quests"></div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,T={},state='ready',score=0,lives=3,best=0,items=[],parts=[],stars=[],spawn=0,hurt=0,tx=0,last=0,
    streak=0,caught=0,slow=0,glow=0,toast=0,toastTxt='',time=0;
const jar={x:0,y:0,w:80}, keys={}, opt={snd:true,vib:true,zen:false,skin:0,lang:'',world:0};
let meta={total:0,d:'',prog:{},done:{}}, zen=false, ty=0, bestStreak=0, tilt=0, lastW=0, swarmId=0, swc={};
const SK=[{n:'jar',u:0},{n:'lamp',u:60},{n:'mug',u:200}];
const QS=[{k:'caught',n:60},{k:'gold',n:3},{k:'streak',n:15},{k:'level',n:5},{k:'slow',n:2}];
const dkey=()=>new Date().toLocaleDateString('sv');
const todays=()=>{const n=Math.floor(Date.now()/864e5); return [0,2,4].map(i=>QS[(n+i)%5])};
function saveMeta(){try{localStorage.setItem('firefly-meta',JSON.stringify(meta))}catch(e){}}
function loadMeta(){
  try{Object.assign(meta,JSON.parse(localStorage.getItem('firefly-meta')||'{}'))}catch(e){}
  if(meta.d!==dkey()){meta.d=dkey(); meta.prog={}; meta.done={}}
  if(!SK[opt.skin]||meta.total<SK[opt.skin].u) opt.skin=0;
}
function q(k,v,mx){
  const t=todays().find(x=>x.k===k); if(!t||meta.done[k]) return;
  meta.prog[k]=mx?Math.max(meta.prog[k]||0,v):(meta.prog[k]||0)+v;
  if(meta.prog[k]>=t.n){meta.done[k]=1; toastTxt=L('qdone'); toast=1.8; seq([659,784,1047],'triangle')}
  saveMeta();
}
function renderQ(){
  const nl=SK.find(x=>meta.total<x.u);
  $('quests').innerHTML='<div style="font-weight:700;margin-bottom:4px">'+L('daily')+'</div>'+
    todays().map(t=>{const p=Math.min(t.n,meta.prog[t.k]||0), ok=meta.done[t.k];
      return '<div'+(ok?' class="ok"':'')+'>'+(ok?'✓ ':'')+L('q_'+t.k)+' <b>'+p+'/'+t.n+'</b></div>'}).join('')+
    (nl?'<div class="hint">'+L('hint',L('sk_'+nl.n),nl.u,meta.total)+'</div>':'');
}
function drawSkin(){
  const jy=jar.y, hw=jar.w/2, x=jar.x, s=opt.skin;
  const path=()=>{
    ctx.beginPath();
    if(s===1){ctx.moveTo(x-hw+6,jy); ctx.lineTo(x+hw-6,jy); ctx.lineTo(x+hw,jy+52); ctx.lineTo(x-hw,jy+52)}
    else{ctx.moveTo(x-hw,jy); ctx.lineTo(x+hw,jy); ctx.lineTo(x+hw*.85,jy+54); ctx.lineTo(x-hw*.85,jy+54)}
    ctx.closePath();
  };
  ctx.save(); path(); ctx.globalAlpha=.14; ctx.fillStyle=T.jar; ctx.fill(); ctx.globalAlpha=1; ctx.clip();
  const g=ctx.createRadialGradient(x,jy+30,2,x,jy+30,hw+10);
  g.addColorStop(0,T.fly); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalAlpha=Math.min(1,.28+Math.max(0,glow)*.7); ctx.fillStyle=g; ctx.fillRect(x-hw-10,jy,jar.w+20,70);
  ctx.restore(); ctx.globalAlpha=1;
  ctx.strokeStyle=T.jar; ctx.lineWidth=3; path(); ctx.stroke();
  ctx.fillStyle=T.jar;
  if(s===1){ctx.fillRect(x-hw+2,jy-8,jar.w-4,8); ctx.beginPath(); ctx.arc(x,jy-8,hw*.6,Math.PI,0); ctx.stroke()}
  else{ctx.fillRect(x-hw-3,jy-5,jar.w+6,6); ctx.beginPath(); ctx.arc(x+hw+2,jy+24,13,-1.4,1.4); ctx.stroke()}
}
try{best=+localStorage.getItem('firefly-best')||0; Object.assign(opt,JSON.parse(localStorage.getItem('firefly-opt')||'{}'))}catch(e){}

function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  ['fly','rock','jar','ink','star','moon','moth'].forEach(k=>T[k]=cs.getPropertyValue(k==='ink'?'--ink':'--'+k).trim());
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);

function resize(){
  const d=window.devicePixelRatio||1;
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*d; cv.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  if(!jar.x){jar.x=tx=W/2; jar.y=ty=Math.min(H-64,H*.75)} ty=clampY(ty); jar.y=clampY(jar.y);
  stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.3+.4,p:Math.random()*6.28}));
}
addEventListener('resize',resize);

/* языки */
const I18={
ru:{name:'Ловец светлячков',rules:'Води банку пальцем во все стороны и лови светлячков. Камни, мотыльки и пропущенный светлячок отнимают жизнь. Золотой даёт +5, ♥ возвращает жизнь, ❄ замедляет время. Лови подряд, и растёт множитель.',yourBest:n=>'Твой рекорд: '+n+'.',play:'Играть',pause:'Пауза',resume:'Продолжить',again:'Играть снова',finish:'Завершить',score:'Счёт',level:'Уровень',streak:'серия',best:'Рекорд',newBest:'Новый рекорд!',over:'Игра окончена',maxStreak:'Лучшая серия',sound:'Звук',on:'вкл',off:'выкл',vibration:'Вибрация',mode:'Режим',zen:'Дзен',normal:'Обычный',skin:'Вид',sk_jar:'Банка',sk_lamp:'Фонарик',sk_mug:'Кружка',daily:'Задания дня',qdone:'Задание выполнено!',hint:(n,u,t)=>'«'+n+'» откроется после '+u+' пойманных: сейчас '+t,q_caught:'Поймай 60 светлячков',q_gold:'Поймай 3 золотых',q_streak:'Серия из 15 подряд',q_level:'Дойди до 5 уровня',q_slow:'Поймай 2 снежинки ❄',share:'Поделиться',shareText:n=>'Я набрал '+n+' в «Ловце светлячков». Побей!',copied:'Скопировано!',swarm:'Рой! +10',world:'Мир',w0:'Авто',w1:'Классика',w2:'Лес',w3:'Море',w4:'Горы',w5:'Космос'},
en:{name:'Firefly Catcher',rules:'Drag the jar in any direction and catch the fireflies. Rocks, moths and missed fireflies cost a life. Gold gives +5, ♥ restores a life, ❄ slows time. Catch in a row to grow the multiplier.',yourBest:n=>'Your best: '+n+'.',play:'Play',pause:'Paused',resume:'Resume',again:'Play again',finish:'Finish',score:'Score',level:'Level',streak:'streak',best:'Best',newBest:'New best!',over:'Game over',maxStreak:'Best streak',sound:'Sound',on:'on',off:'off',vibration:'Vibration',mode:'Mode',zen:'Zen',normal:'Normal',skin:'Look',sk_jar:'Jar',sk_lamp:'Lantern',sk_mug:'Mug',daily:'Daily quests',qdone:'Quest complete!',hint:(n,u,t)=>'«'+n+'» unlocks after '+u+' catches: now '+t,q_caught:'Catch 60 fireflies',q_gold:'Catch 3 golden ones',q_streak:'Get a streak of 15',q_level:'Reach level 5',q_slow:'Catch 2 snowflakes ❄',share:'Share',shareText:n=>'I scored '+n+' in Firefly Catcher. Beat me!',copied:'Copied!',swarm:'Swarm! +10',world:'World',w0:'Auto',w1:'Classic',w2:'Forest',w3:'Sea',w4:'Mountains',w5:'Space'},
tr:{name:'Ateş Böceği Avcısı',rules:'Kavanozu her yöne sürükle ve ateş böceklerini yakala. Taşlar, güveler ve kaçırılan ateş böcekleri bir can götürür. Altın +5 verir, ♥ can yeniler, ❄ zamanı yavaşlatır. Art arda yakala, çarpan büyüsün.',yourBest:n=>'Rekorun: '+n+'.',play:'Oyna',pause:'Duraklatıldı',resume:'Devam',again:'Tekrar oyna',finish:'Bitir',score:'Skor',level:'Seviye',streak:'seri',best:'Rekor',newBest:'Yeni rekor!',over:'Oyun bitti',maxStreak:'En iyi seri',sound:'Ses',on:'açık',off:'kapalı',vibration:'Titreşim',mode:'Mod',zen:'Zen',normal:'Normal',skin:'Görünüm',sk_jar:'Kavanoz',sk_lamp:'Fener',sk_mug:'Kupa',daily:'Günün görevleri',qdone:'Görev tamamlandı!',hint:(n,u,t)=>'«'+n+'» '+u+' yakalamadan sonra açılır: şimdi '+t,q_caught:'60 ateş böceği yakala',q_gold:'3 altın yakala',q_streak:'15 art arda yakala',q_level:'5. seviyeye ulaş',q_slow:'2 kar tanesi ❄ yakala',share:'Paylaş',shareText:n=>'Ateş Böceği Avcısı\'nda '+n+' puan yaptım. Geç beni!',copied:'Kopyalandı!',swarm:'Sürü! +10',world:'Dünya',w0:'Otomatik',w1:'Klasik',w2:'Orman',w3:'Deniz',w4:'Dağlar',w5:'Uzay'}
};
function L(k,...x){const v=(I18[opt.lang]||I18.ru)[k]; return typeof v==='function'?v(...x):v}
const homeFn=()=>[L('name'),L('rules')+(best>0?' '+L('yourBest',best):''),L('play')];
function applyLang(){
  document.documentElement.lang=opt.lang; document.title=L('name');
  $('pz').setAttribute('aria-label',L('pause')); $('fin').textContent=L('finish'); $('share').textContent=L('share');
  if(panelFn){const [a,b,c]=panelFn(); $('title').textContent=a; $('text').textContent=b; $('btn').textContent=c}
  refreshOpts(); ui();
}
function clampY(v){return Math.max(H*.45,Math.min(H-64,v))}
/* миры и рой */
const WD={
 2:{g:['#0a1a24','#17382f'],r:[['#0f2a25',.62,70,.012,.03,1],['#0b1f1d',.73,90,.009,.06,1],['#071513',.85,110,.007,.1,1]]},
 3:{g:['#071a3a','#0d4a6b'],r:[['#0e5a7a',.8,14,.02,.02,0,40],['#0a4562',.86,16,.015,.04,0,-30],['#06304a',.93,18,.012,.07,0,22]]},
 4:{g:['#2a1b4d','#c0607a'],r:[['#6b4a8f',.55,120,.006,.03,1],['#4a3270',.69,110,.008,.06,1],['#2d1f4d',.83,100,.01,.1,1]]},
 5:{g:['#05010f','#1a0b3a'],r:[]}
};
function curWorld(){return opt.world===0?[2,3,4,5][Math.floor((level()-1)/3)%4]:opt.world}
function skyFill(w){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,WD[w].g[0]); g.addColorStop(1,WD[w].g[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(w===5) [[.25,.3,'rgba(120,60,200,.28)'],[.8,.55,'rgba(40,120,200,.22)']].forEach(([x,y,c],i)=>{
    const px=W*x-(jar.x-W/2)*.02*(i+1), py=H*y, r=Math.max(W,H)*.5, q=ctx.createRadialGradient(px,py,0,px,py,r);
    q.addColorStop(0,c); q.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=q; ctx.fillRect(0,0,W,H);
  });
}
function ridge(col,base,amp,fr,par,k,ts){
  const off=-(jar.x-W/2)*par+time*(ts||0);
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W+8;x+=8){
    const u=(x+off)*fr, v=k?Math.abs(Math.sin(u))*.7+.3*Math.sin(u*.41+1):(Math.sin(u)+.5*Math.sin(u*2.3+1))*.35+.5;
    ctx.lineTo(x,H*base-amp*v+amp*.4);
  }
  ctx.lineTo(W+8,H); ctx.closePath(); ctx.fill();
}
function swarm(){
  const id=++swarmId, cx=80+Math.random()*(W-160), z=.7+Math.random()*.3;
  for(let i=0;i<6;i++){
    const an=i/6*6.283, x=cx+Math.cos(an)*26;
    items.push({type:'fly',x,x0:x,y:-20-Math.sin(an)*26,r:11,ph:Math.random()*6.28,z,sw:id,shape:null});
  }
}
/* звук и вибрация */
let ac=null;
function tone(f,d,type,v,f2){
  if(!opt.snd) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||.1,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const seq=(a,type)=>a.forEach((f,i)=>setTimeout(()=>tone(f,.14,type,.1),i*80));
function vib(ms){ if(opt.vib) try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){} }
function refreshOpts(){
  $('snd').textContent=L('sound')+': '+(opt.snd?L('on'):L('off')); $('snd').setAttribute('aria-pressed',opt.snd);
  $('vib').textContent=L('vibration')+': '+(opt.vib?L('on'):L('off')); $('vib').setAttribute('aria-pressed',opt.vib);
  $('mode').textContent=L('mode')+': '+(opt.zen?L('zen'):L('normal')); $('skin').textContent=L('skin')+': '+L('sk_'+SK[opt.skin].n);
  $('world').textContent=L('world')+': '+L('w'+opt.world);
  $('lang').textContent='🌐 '+({ru:'Русский',en:'English',tr:'Türkçe'})[opt.lang]; renderQ();
  try{localStorage.setItem('firefly-opt',JSON.stringify(opt))}catch(e){}
}
$('snd').onclick=()=>{opt.snd=!opt.snd; refreshOpts(); tone(660,.1,'sine',.1)};
$('vib').onclick=()=>{opt.vib=!opt.vib; refreshOpts(); vib(30)};
$('mode').onclick=()=>{if(state==='pause') return; opt.zen=!opt.zen; refreshOpts()};
$('skin').onclick=()=>{for(let i=1;i<=3;i++){const c=(opt.skin+i)%3; if(meta.total>=SK[c].u){opt.skin=c; break}} refreshOpts()};
$('fin').onclick=()=>{if(state==='pause') end()};
$('world').onclick=()=>{opt.world=(opt.world+1)%6; refreshOpts()};
$('lang').onclick=()=>{const l=['ru','en','tr']; opt.lang=l[(l.indexOf(opt.lang)+1)%3]; applyLang()};
$('share').onclick=async()=>{
  const txt=L('shareText',score)+' '+location.href;
  try{ if(navigator.share) await navigator.share({text:txt}); else{await navigator.clipboard.writeText(txt); $('share').textContent=L('copied')} }catch(e){}
};

/* состояние */
const mult=()=>Math.min(5,1+Math.floor(streak/5));
const level=()=>1+Math.floor(caught/12);
function ui(){
  $('score').textContent=score; $('bestv').textContent=zen?'':L('best')+': '+Math.max(best,score);
  $('lives').textContent=zen?'∞':'♥'.repeat(lives)+'♡'.repeat(3-lives);
  $('combo').textContent=streak>=2?L('streak')+' '+streak+(mult()>1?'  ×'+mult():''):'';
  $('lvl').textContent=state==='ready'?'':L('level')+' '+level()+(slow>0?' ❄':'');
}
let panelFn=null;
function showPanel(fn){
  panelFn=fn; const [a,b,c]=fn();
  $('title').textContent=a; $('text').textContent=b; $('btn').textContent=c;
  $('fin').classList.add('hide'); $('share').classList.add('hide'); refreshOpts(); $('panel').classList.remove('hide');
}
function start(){
  score=0; lives=3; items=[]; parts=[]; spawn=.4; hurt=0; streak=0; caught=0; slow=0; glow=0; toast=0;
  bestStreak=0; swc={}; zen=opt.zen; state='play'; readTheme(); ui(); $('panel').classList.add('hide');
  tone(440,.1,'sine',.08);
}
function pause(){
  if(state==='play'){state='pause'; showPanel(()=>[L('pause'),L('score')+': '+score+'. '+L('level')+' '+level()+'.',L('resume')]); $('fin').classList.toggle('hide',!zen); saveMeta()}
  else if(state==='pause') resume();
}
function resume(){state='play'; $('panel').classList.add('hide'); ui()}
function end(){
  state='over';
  const nb=!zen&&score>best; saveMeta();
  if(nb){best=score; try{localStorage.setItem('firefly-best',best)}catch(e){}}
  showPanel(()=>[nb?L('newBest'):L('over'),L('score')+': '+score+(zen?'':'. '+L('best')+': '+best)+'. '+L('maxStreak')+': '+bestStreak+'.',L('again')]); $('share').classList.remove('hide');
  ui(); seq([392,330,262],'triangle');
}
function hit(){
  if(!zen) lives--; streak=0; hurt=.3; vib(60); ui();
  if(lives<=0) end();
}
function burst(x,y,col,n){
  for(let i=0;i<n&&parts.length<140;i++){
    const a=Math.random()*6.283, s=40+Math.random()*120;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.5+Math.random()*.4,max:.9,col});
  }
}
function collect(it){
  const t=it.type;
  if(t==='rock'||t==='moth'){
    burst(it.x,it.y,t==='rock'?T.rock:T.moth,12); tone(120,.3,'sawtooth',.13,50); hit(); return;
  }
  if(t==='fly'||t==='gold'){
    const lv=level(); streak++; caught++; glow=1;
    score+=(t==='gold'?5:1)*mult(); if(it.sw){swc[it.sw]=(swc[it.sw]||0)+1; if(swc[it.sw]===6){score+=10*mult(); toastTxt=L('swarm'); toast=1.8; seq([784,988,1319],'triangle')}}
    bestStreak=Math.max(bestStreak,streak); meta.total++; q('caught',1); q('streak',streak,1); if(t==='gold') q('gold',1);
    burst(it.x,it.y,t==='gold'?'#fff3b0':T.fly,t==='gold'?18:9);
    if(t==='gold') seq([660,880,1320]); else tone(520+Math.min(streak,20)*25,.12,'sine',.12);
    if(level()>lv){toastTxt=L('level')+' '+level(); toast=1.8; setTimeout(()=>seq([523,659,784],'triangle'),150); q('level',level(),1)}
    vib(12);
  } else if(t==='heart'){
    lives=Math.min(3,lives+1); burst(it.x,it.y,'#ff5a6e',14); seq([523,784]); vib(20);
  } else if(t==='slow'){
    slow=5; q('slow',1); burst(it.x,it.y,'#6fd3ff',14); tone(700,.45,'sine',.12,180); vib(20);
  }
  ui();
}
function addItem(){
  const lv=level(), r0=Math.random();
  const pr=Math.min(.16+lv*.03,.36), pm=lv>=3?Math.min(.05+lv*.01,.14):0;
  let type='fly';
  if(r0<pr) type='rock'; else if(r0<pr+pm) type='moth';
  else{
    const b=Math.random();
    if(b<.05) type='gold'; else if(b<.075&&lives<3) type='heart'; else if(b<.10) type='slow';
  }
  const r={rock:16+Math.random()*8,moth:15,gold:13,fly:11}[type]||13;
  const x=r+60+Math.random()*Math.max(1,W-2*r-120);
  items.push({type,x,x0:x,y:-r,r,ph:Math.random()*6.28,z:.6+Math.random()*.4,
    shape:type==='rock'?Array.from({length:7},()=>.78+Math.random()*.22):null});
}
function update(dt){
  time+=dt;
  const dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  if(dir) tx+=dir*560*dt;
  tx=Math.max(jar.w/2,Math.min(W-jar.w/2,tx));
  jar.x+=(tx-jar.x)*Math.min(1,dt*18);
  const dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(dy) ty+=dy*420*dt; ty=clampY(ty); jar.y+=(ty-jar.y)*Math.min(1,dt*18); tilt=Math.max(-.3,Math.min(.3,(tx-jar.x)*.004));
  if(glow>0) glow-=dt*1.4;
  if(hurt>0) hurt-=dt;
  if(toast>0) toast-=dt;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt;
    if(p.life<=0) parts.splice(i,1);
  }
  if(state!=='play') return;
  const lv=level(), sl=slow>0;
  if(sl){slow-=dt; if(slow<=0) ui()}
  spawn-=dt;
  if(spawn<=0){ if(lv>=2&&Math.random()<.07) swarm(); else addItem(); spawn=Math.max(.42,.95-(lv-1)*.07)*(sl?1.4:1)}
  const speed=Math.min(140+(lv-1)*26,420)*(sl?.55:1), jy=jar.y;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.y+=speed*dt*(it.type==='moth'?.85:1)*(.85+.15*it.z); it.ph+=dt*6;
    if(it.type==='moth') it.x=Math.max(it.r,Math.min(W-it.r,it.x0+Math.sin(it.ph*.5)*48));
    if(it.y+it.r>jy && it.y-it.r<jy+18 && Math.abs(it.x-jar.x)<jar.w/2+it.r*.3){
      items.splice(i,1); collect(it);
      if(state!=='play') return;
    } else if(it.y-it.r>H){
      items.splice(i,1);
      if(it.type==='fly'&&!it.sw){tone(220,.2,'triangle',.1,140); hit()}
      if(state!=='play') return;
    }
  }
}
function wing(x,y,rx,ry,rot,col,a){
  ctx.globalAlpha=a; ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,6.283); ctx.fill(); ctx.globalAlpha=1;
}
function drawItem(it){
  const k=.72+.28*it.z; ctx.save(); ctx.translate(it.x,it.y); ctx.scale(k,k); ctx.translate(-it.x,-it.y); drawItem0(it); ctx.restore();
}
function drawItem0(it){
  const {x,y,r,ph,type}=it;
  if(type==='rock'){
    ctx.fillStyle=T.rock; ctx.beginPath();
    it.shape.forEach((k,j)=>{
      const a=j/7*6.283+ph*.1, px=x+Math.cos(a)*r*k, py=y+Math.sin(a)*r*k;
      j?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });
    ctx.closePath(); ctx.fill();
  } else if(type==='moth'){
    const f=Math.sin(ph*2.5)*.4;
    wing(x-11,y-3,11,6+f*4,-.5,T.moth,.85); wing(x+11,y-3,11,6+f*4,.5,T.moth,.85);
    ctx.fillStyle=T.ink; ctx.beginPath(); ctx.ellipse(x,y,3.5,9,0,0,6.283); ctx.fill();
  } else if(type==='heart'||type==='slow'){
    const c=type==='heart'?'#ff5a6e':'#6fd3ff';
    ctx.shadowColor=c; ctx.shadowBlur=16; ctx.fillStyle=c;
    ctx.font='700 '+(r*2.3)+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(type==='heart'?'♥':'❄',x,y+1); ctx.shadowBlur=0;
  } else {
    const gold=type==='gold', col=gold?'#ff9d00':T.fly;
    for(let k=1;k<=4;k++){ctx.globalAlpha=.2/k*1.6; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y-k*9,r*(1-k*.17),0,6.283); ctx.fill()}
    ctx.globalAlpha=1;
    const f=Math.sin(ph*3)*.5+.5;
    wing(x-r*.8,y-5,7,3+f*3,-.6,'#fff',.55); wing(x+r*.8,y-5,7,3+f*3,.6,'#fff',.55);
    ctx.shadowColor=col; ctx.shadowBlur=18+Math.sin(ph)*6;
    ctx.fillStyle=gold?'#fffbe0':T.fly; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
    ctx.shadowBlur=0;
    if(gold){ctx.strokeStyle='#ff9d00'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x,y,r+5+Math.sin(ph)*1.5,0,6.283); ctx.stroke()}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const w=curWorld();
  if(w!==lastW){lastW=w; document.documentElement.dataset.theme=w===1?'':'dark'; readTheme()}
  if(w>1) skyFill(w);
  for(const s of stars){
    ctx.globalAlpha=.3+.4*Math.sin(time*1.6+s.p); ctx.fillStyle=T.star;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.shadowColor=T.moon; ctx.shadowBlur=36; ctx.fillStyle=T.moon;
  ctx.beginPath(); ctx.arc(W*.2,Math.min(150,H*.2),24,0,6.283); ctx.fill(); ctx.shadowBlur=0;
  if(w>1) WD[w].r.forEach(x=>ridge(...x));
  if(slow>0){ctx.fillStyle='rgba(111,211,255,.09)'; ctx.fillRect(0,0,W,H)}
  ctx.save(); ctx.setLineDash([6,10]); ctx.globalAlpha=.16; ctx.strokeStyle=T.ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,H*.45-8); ctx.lineTo(W,H*.45-8); ctx.stroke(); ctx.restore();
  items.slice().sort((p,q)=>p.z-q.z).forEach(it=>drawItem(it));
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  /* банка */
  ctx.save(); ctx.globalAlpha=.18; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(jar.x,H-10,jar.w*.55,6,0,0,6.283); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(jar.x,jar.y+30); ctx.rotate(tilt); ctx.translate(-jar.x,-jar.y-30);
  if(opt.skin>0) drawSkin(); else {
  const jy=jar.y, hw=jar.w/2, x=jar.x;
  ctx.save(); ctx.beginPath();
  ctx.moveTo(x-hw,jy); ctx.lineTo(x+hw,jy); ctx.lineTo(x+hw*.8,jy+50);
  ctx.quadraticCurveTo(x,jy+60,x-hw*.8,jy+50); ctx.closePath();
  ctx.globalAlpha=.14; ctx.fillStyle=T.jar; ctx.fill(); ctx.globalAlpha=1;
  ctx.clip();
  const g=ctx.createRadialGradient(x,jy+30,2,x,jy+30,hw+10);
  g.addColorStop(0,T.fly); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalAlpha=Math.min(1,.28+Math.max(0,glow)*.7); ctx.fillStyle=g; ctx.fillRect(x-hw-10,jy,jar.w+20,70);
  ctx.globalAlpha=.22; ctx.fillStyle='#fff'; ctx.fillRect(x-hw*.6,jy+4,5,40);
  ctx.restore(); ctx.globalAlpha=1;
  ctx.strokeStyle=T.jar; ctx.lineWidth=3; ctx.beginPath();
  ctx.moveTo(x-hw,jy); ctx.lineTo(x-hw*.8,jy+50); ctx.quadraticCurveTo(x,jy+60,x+hw*.8,jy+50); ctx.lineTo(x+hw,jy); ctx.stroke();
  ctx.fillStyle=T.jar; ctx.fillRect(x-hw-4,jy-6,jar.w+8,8);
  }
  ctx.restore();
  if(hurt>0){ctx.fillStyle='rgba(220,60,60,'+Math.min(.4,hurt*1.3)+')'; ctx.fillRect(0,0,W,H)}
  if(toast>0){
    ctx.globalAlpha=Math.min(1,toast); ctx.fillStyle=T.ink; ctx.font='700 34px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(toastTxt,W/2,H*.3-(1.8-toast)*14); ctx.globalAlpha=1;
  }
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0); last=t;
  if(state!=='pause') update(dt);
  draw(); requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{tx=e.clientX; ty=clampY(e.clientY-80)});
cv.addEventListener('pointermove',e=>{tx=e.clientX; ty=clampY(e.clientY-80)});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyP'||e.code==='Escape'||(e.code==='Space'&&(state==='play'||state==='pause'))){e.preventDefault(); pause()}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys) keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play') pause()});
$('pz').addEventListener('click',pause);
$('btn').addEventListener('click',()=>state==='pause'?resume():start());

loadMeta(); if(!I18[opt.lang]) opt.lang=({ru:'ru',tr:'tr'})[(navigator.language||'en').slice(0,2)]||'en'; panelFn=homeFn; applyLang(); resize(); readTheme(); ui(); requestAnimationFrame(loop);
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
