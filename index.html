<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ловец светлячков</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#221c55">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --sky1:#ffe3cf; --sky2:#bda9ee; --ink:#2a2350; --fly:#e89b00; --rock:#5b5477;
  --jar:#2a2350; --panel:rgba(255,255,255,.9); --accent:#5a3fd0; --onaccent:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#221c55; --sky2:#0a0922; --ink:#f3eeff; --fly:#ffd86b; --rock:#8a84ad;
    --jar:#f3eeff; --panel:rgba(20,17,50,.92); --accent:#ffd86b; --onaccent:#1b1745;
  }
}
:root[data-theme="dark"]{
  --sky1:#221c55; --sky2:#0a0922; --ink:#f3eeff; --fly:#ffd86b; --rock:#8a84ad;
  --jar:#f3eeff; --panel:rgba(20,17,50,.92); --accent:#ffd86b; --onaccent:#1b1745;
}
html{height:100%; background:linear-gradient(var(--sky1),var(--sky2)); scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; position:relative; overflow:hidden; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:transparent;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block}
#hud{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
  padding:14px 20px; font-size:26px; font-weight:700; pointer-events:none}
#lives{letter-spacing:4px; color:var(--fly)}
#panel{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(86%,340px);
  background:var(--panel); border-radius:22px; padding:26px 22px; text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.25)}
#panel h1{margin:0 0 10px; font-size:28px; line-height:1.15}
#panel p{margin:0 0 20px; font-size:16px; line-height:1.45}
#panel button{font:inherit; font-size:18px; font-weight:700; border:0; border-radius:14px;
  padding:14px 34px; background:var(--accent); color:var(--onaccent); cursor:pointer}
#panel button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">0</span><span id="lives"></span></div>
<div id="panel">
  <h1 id="title">Ловец светлячков</h1>
  <p id="text">Води банку пальцем и лови светлячков. Камни ловить нельзя. Пропущенный светлячок или пойманный камень отнимает жизнь.</p>
  <button id="btn">Играть</button>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,T={},state='ready',score=0,lives=3,best=0,items=[],spawn=0,hurt=0,tx=0,last=0;
const jar={x:0,w:76};
try{best=+localStorage.getItem('firefly-best')||0}catch(e){}

function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  ['fly','rock','jar'].forEach(k=>T[k]=cs.getPropertyValue('--'+k).trim());
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);

function resize(){
  const d=window.devicePixelRatio||1;
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*d; cv.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  if(!jar.x){jar.x=tx=W/2}
}
addEventListener('resize',resize);

function setLives(){
  $('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);
}
function start(){
  score=0; lives=3; items=[]; spawn=0.4; hurt=0; state='play';
  $('score').textContent=0; setLives(); readTheme();
  $('panel').classList.add('hide');
}
function end(){
  state='over';
  if(score>best){best=score; try{localStorage.setItem('firefly-best',best)}catch(e){}}
  $('title').textContent='Игра окончена';
  $('text').textContent='Счёт: '+score+'. Рекорд: '+best+'.';
  $('btn').textContent='Играть снова';
  $('panel').classList.remove('hide');
}
function hit(){
  lives--; hurt=0.3; setLives();
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  if(lives<=0) end();
}
function addItem(){
  const rock=Math.random()<Math.min(0.22+score*0.004,0.4);
  const r=rock?16+Math.random()*8:11;
  items.push({
    x:r+10+Math.random()*(W-2*r-20), y:-r, r, rock,
    shape:rock?Array.from({length:7},()=>0.78+Math.random()*0.22):null,
    ph:Math.random()*6.28
  });
}
function update(dt){
  jar.x+=(tx-jar.x)*Math.min(1,dt*18);
  jar.x=Math.max(jar.w/2,Math.min(W-jar.w/2,jar.x));
  if(hurt>0) hurt-=dt;
  if(state!=='play') return;
  spawn-=dt;
  if(spawn<=0){addItem(); spawn=Math.max(0.45,1-score*0.012)}
  const speed=Math.min(150+score*5,430), jy=H-70;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.y+=speed*dt; it.ph+=dt*6;
    if(it.y+it.r>jy && it.y-it.r<jy+18 && Math.abs(it.x-jar.x)<jar.w/2+it.r*0.3){
      items.splice(i,1);
      if(it.rock) hit(); else {score++; $('score').textContent=score}
      if(state!=='play') return;
    } else if(it.y-it.r>H){
      items.splice(i,1);
      if(!it.rock) hit();
      if(state!=='play') return;
    }
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const it of items){
    if(it.rock){
      ctx.fillStyle=T.rock; ctx.beginPath();
      it.shape.forEach((k,j)=>{
        const a=j/7*6.283+it.ph*0.1, px=it.x+Math.cos(a)*it.r*k, py=it.y+Math.sin(a)*it.r*k;
        j?ctx.lineTo(px,py):ctx.moveTo(px,py);
      });
      ctx.closePath(); ctx.fill();
    } else {
      ctx.shadowColor=T.fly; ctx.shadowBlur=18+Math.sin(it.ph)*6;
      ctx.fillStyle=T.fly; ctx.beginPath();
      ctx.arc(it.x,it.y,it.r,0,6.283); ctx.fill();
      ctx.shadowBlur=0;
    }
  }
  const jy=H-70, hw=jar.w/2;
  ctx.fillStyle=T.jar; ctx.globalAlpha=0.9; ctx.beginPath();
  ctx.moveTo(jar.x-hw,jy); ctx.lineTo(jar.x+hw,jy);
  ctx.lineTo(jar.x+hw*0.8,jy+50); ctx.quadraticCurveTo(jar.x,jy+60,jar.x-hw*0.8,jy+50);
  ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillRect(jar.x-hw-4,jy-6,jar.w+8,8);
  if(hurt>0){ctx.fillStyle='rgba(220,60,60,'+Math.min(0.4,hurt*1.3)+')'; ctx.fillRect(0,0,W,H)}
}
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000||0); last=t;
  update(dt); draw(); requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{tx=e.clientX});
cv.addEventListener('pointermove',e=>{tx=e.clientX});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') tx-=40;
  if(e.key==='ArrowRight') tx+=40;
});
$('btn').addEventListener('click',start);
if(best>0) $('text').textContent+=' Твой рекорд: '+best+'.';
resize(); readTheme(); requestAnimationFrame(loop);
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
